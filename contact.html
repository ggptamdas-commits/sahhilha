<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا | سهّلها</title>
  <meta name="description" content="تواصل مع فريق منصة سهّلها للاستفسارات والاقتراحات.">
  <link rel="canonical" href="https://sahhilha.com/contact.html">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-container">
      <div class="brand-logo">
        <a href="/" aria-label="سهّلها" style="display:flex; align-items:center; gap:0.75rem;">
          <div class="brand-symbol">س</div>
          <div class="brand-text">
            <span class="brand-name">سهّلها</span>
            <span class="brand-tagline">أدوات مجانية تجعل حياتك أسهل</span>
          </div>
        </a>
      </div>
      <nav class="nav-desktop">
        <a href="/" class="nav-link">الرئيسية</a>
        <a href="/#featured-tools" class="nav-link">جميع الأدوات</a>
        <a href="/#guides" class="nav-link">الأدلة</a>
        <a href="/about.html" class="nav-link">من نحن</a>
        <a href="/contact.html" class="nav-link active">اتصل بنا</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn-icon" id="theme-toggle-btn" aria-label="التبديل بين الوضع الداكن والفاتح">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container" style="padding: 4rem 1.25rem; max-width: 650px;">
    <h1>اتصل بنا</h1>
    <p style="margin: 1rem 0 2rem; font-size: 1.05rem;">
      يسعدنا دائماً استقبال آرائكم واقتراحاتكم لتطوير الأدوات أو إضافة أدوات جديدة تلبي احتياجاتكم.
    </p>

    <div style="background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem;">
      <form onsubmit="event.preventDefault(); alert('شكراً لتواصلك معنا! سيتم الرد قريباً.');" style="display:flex; flex-direction:column; gap:1.25rem;">
        <div>
          <label for="contact-name" style="display:block; margin-bottom:0.5rem; font-weight:600;">الاسم</label>
          <input type="text" id="contact-name" required placeholder="الاسم الكامل" style="width:100%; padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--background); color:var(--text); font-family:inherit;">
        </div>

        <div>
          <label for="contact-email" style="display:block; margin-bottom:0.5rem; font-weight:600;">البريد الإلكتروني</label>
          <input type="email" id="contact-email" required placeholder="name@example.com" style="width:100%; padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--background); color:var(--text); font-family:inherit;">
        </div>

        <div>
          <label for="contact-message" style="display:block; margin-bottom:0.5rem; font-weight:600;">الرسالة أو الاقتراح</label>
          <textarea id="contact-message" rows="5" required placeholder="اكتب رسالتك هنا..." style="width:100%; padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--background); color:var(--text); font-family:inherit;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="align-self:flex-start;">إرسال الرسالة</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align: center;">
      <p>© 2026 سهّلها — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="/config/config.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/navigation.js"></script>
</body>
</html>
